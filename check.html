/* Base64URL */
function b64url(bytes){
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function fromB64url(s){
  const pad='='.repeat((4-s.length%4)%4);
  const bin=atob((s+pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(bin,c=>c.charCodeAt(0));
}

/* Crypto */
async function importKey(raw){
  return crypto.subtle.importKey("raw",raw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);
}
async function hmacToken(key,salt,tag){
  const msg=new TextEncoder().encode(`v1|${salt}|${tag}`);
  const sig=new Uint8Array(await crypto.subtle.sign("HMAC",key,msg));
  return b64url(sig.slice(0,16));
}

/* 表描画（固定ヘッダ対応：thead/tbody） */

        </td>

          <label class="cellLabel"><input type="radio" name="${id}" value="dislike"></label>
        </td>

        <td class="optcol">
          <label class="cellLabel"><input type="radio" name="${id}" value="avoid"></label>

      `;

  root.appendChild(table);
}

/* 判定（有無のみ + 好み判定） */
document.getElementById("checkBtn").onclick = async ()=>{
  const res=document.getElementById("result");
  res.innerHTML="";

  let payload;
  try { payload = JSON.parse(document.getElementById("inJson").value.trim()); }
  catch { res.textContent="配布JSONの形式が正しくありません。"; return; }

  if(!payload || !payload.salt || !payload.key || !Array.isArray(payload.tokens)){
    res.textContent="配布JSONに必要な項目（salt/key/tokens）がありません。";
    return;
  }

  const tokensS=new Set(payload.tokens);
  const hkey=await importKey(fromB64url(payload.key));

  let avoidHit=false;
  let dislikeHit=false;
  let likeHit=false;

  for(const cat of TAG_CATEGORIES){
    for(const [id] of cat.tags){
      const sel=document.querySelector(`input[name="${id}"]:checked`);
      const v=sel ? sel.value : "ok";

      // like/dislike/avoid を選んでいる時だけ照合（okは無視）
      if(v==="ok") continue;

      const tok=await hmacToken(hkey,payload.salt,id);
      if(tokensS.has(tok)){
        if(v==="avoid") avoidHit=true;
        if(v==="dislike") dislikeHit=true;
        if(v==="like") likeHit=true;
      }
    }
  }

  if(avoidHit) res.innerHTML += `<p class="resultStrong">確実に避けたい要素が含まれています。</p>`;
  if(dislikeHit) res.innerHTML += `<p>好ましくない要素が含まれています。</p>`;

  if(!avoidHit && !dislikeHit && likeHit){
    res.innerHTML += `<p class="resultStrong">好みのシナリオと言えるかもしれません。</p>`;
  }

  if(!avoidHit && !dislikeHit && !likeHit){
    res.innerHTML = `<p>（判定上）問題となる要素は検出されませんでした。</p>`;
  }
};
