        /* ===== Base64URL ===== */
        function b64url(bytes) {
            return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }
        function randomB64(len) {
            const b = new Uint8Array(len);
            crypto.getRandomValues(b);
            return b64url(b);
        }

        /* ===== Crypto ===== */
        async function importHmac(raw) {
            return crypto.subtle.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
        }
        async function hmacToken(key, salt, tag) {
            const msg = new TextEncoder().encode(`v1|${salt}|${tag}`);
            const sig = new Uint8Array(await crypto.subtle.sign("HMAC", key, msg));
            return b64url(sig.slice(0, 16));
        }
        async function deriveKeyBytesFromPassphrase(passphrase) {
            const enc = new TextEncoder();
            const passKey = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveBits"]);
            const appSalt = enc.encode("trpg-trigger-check-appsalt-v1");
            const bits = await crypto.subtle.deriveBits(
                { name: "PBKDF2", salt: appSalt, iterations: 200000, hash: "SHA-256" },
                passKey, 256
            );
            return new Uint8Array(bits);
        }

        /* ===== UI描画（labelで包む＝どこでもクリック可） ===== */
        const listRoot = document.getElementById("tagList");
        for (const cat of TAG_CATEGORIES) {
            const h = document.createElement("div");
            h.className = "cat";
            h.textContent = cat.name;
            listRoot.appendChild(h);

            const grid = document.createElement("div");
            grid.className = "grid";

            for (const t of cat.tags) {
                const row = document.createElement("label");
                row.className = "item";
                row.setAttribute("for", "tag_" + t.id);
                row.innerHTML = `
          <span class="label">${t.label}</span>
          <input type="checkbox" id="tag_${t.id}">
        `;
                grid.appendChild(row);
            }
            listRoot.appendChild(grid);
        }

        /* ===== 鍵モード切替 ===== */
        document.querySelectorAll('input[name="keyMode"]').forEach(r => {
            r.addEventListener("change", () => {

                document.getElementById("passphraseBox").style.display = mode === "passphrase" ? "block" : "none";
            });
        });

        /* ===== 生成 ===== */
        document.getElementById("generateBtn").addEventListener("click", async () => {
            const salt = randomB64(16);

            const mode = document.querySelector('input[name="keyMode"]:checked').value;
            let keyBytes;
            if (mode === "random") {
                keyBytes = new Uint8Array(32);
                crypto.getRandomValues(keyBytes);
            } else {
                const pass = (document.getElementById("passphrase").value || "").trim();
                if (!pass) { alert("合言葉を入力してください"); return; }
                keyBytes = await deriveKeyBytesFromPassphrase(pass);
            }
            const keyB64 = b64url(keyBytes);
            const hmacKey = await importHmac(keyBytes);

            const tokens = [];
            for (const cat of TAG_CATEGORIES) {
                for (const t of cat.tags) {
                    if (document.getElementById("tag_" + t.id).checked) {
                        tokens.push(await hmacToken(hmacKey, salt, t.id));
                    }
                }
            }

            /* ダミーで64固定 */
            while (tokens.length < TARGET_TOKEN_COUNT) {
                tokens.push(randomB64(16)); // 一致しないダミー
            }

            /* シャッフル */
            for (let i = tokens.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [tokens[i], tokens[j]] = [tokens[j], tokens[i]];
            }

            const payload = { v: 2, salt, key: keyB64, tokens };
            document.getElementById("outJson").value = JSON.stringify(payload, null, 2);
        });
